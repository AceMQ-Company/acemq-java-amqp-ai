# Build and test on every JDK this library promises to run on.
#
# Nothing here calls a model. The adapters are tested against a scripted model server on
# loopback and the queue behaviour against the in-memory broker, so CI needs neither a GPU,
# a key, nor Docker. The *LiveIT tests that do call real models run only under -Plive.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 17 is the minimum toolchain, 21 and 25 are what estates actually run.
        # Published bytecode is Java 11 regardless, matching acemq-java-amqp.
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: mvn -B --no-transfer-progress clean verify

      - name: Verify published bytecode targets Java 11
        if: matrix.java == '17'
        # A Java 11 JVM refuses any class file newer than major 55, so this is
        # the check that keeps the Java 11 promise true rather than aspirational.
        run: |
          for jar in acemq-ai-core/target/acemq-ai-core-*.jar:org/acemq/ai/ModelClient.class \
                     acemq-ai-test/target/acemq-ai-test-*.jar:org/acemq/ai/test/ScriptedModel.class; do
            class=$(unzip -p ${jar%%:*} ${jar#*:} | xxd -p -l 8 | cut -c13-16)
            echo "${jar#*:}: class file major version 0x$class (expected 0037 = 55 = Java 11)"
            test "$class" = "0037"
          done

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-jdk${{ matrix.java }}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 7

  badge-matches-the-release:
    name: the README badge names the current release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare the version badge against the newest release tag
        # A README badge is the first thing a reader sees and nothing keeps it
        # in step. This one said 0.1.4 while the library was at 0.7.0 -- six
        # minor versions, sitting at the top of the page, wrong since 0.1.4 was
        # the truth. acemq-java-amqp stays correct only because its release
        # rewrites the documented version; every other repository updates the
        # badge by hand, which means sometimes.
        #
        # Tags come from ls-remote so this needs no token on a scheduled run.
        # Only plain vX.Y.Z tags count: Go publishes nested modules as
        # codec/avro/vX.Y.Z, and those are not the repository's version.
        run: |
          newest=$(git ls-remote --tags origin \
            | sed -e 's#.*refs/tags/##' -e 's#\^{}$##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^v//' | sort -V | tail -1)
          badge=$(grep -oE 'badge/version-[0-9][0-9.]*' README.md | head -1 | sed 's|badge/version-||')

          if [ -z "$newest" ]; then
            echo "no release tags yet, so there is nothing for the badge to disagree with"
            exit 0
          fi
          if [ -z "$badge" ]; then
            echo "::error::no version badge found in README.md, so this check cannot do its job"
            exit 1
          fi
          # Behind is the failure; ahead is a release being prepared.
          #
          # The badge is bumped in the commit that readies a release, which is
          # pushed before the tag exists -- so for a few minutes the badge names
          # a version no tag does. Failing on any difference would redden that
          # commit and block the release it is part of, which is the check
          # sabotaging the thing it is meant to protect. Only a badge older than
          # the newest release is wrong.
          older=$(printf '%s\n%s\n' "$badge" "$newest" | sort -V | head -1)
          if [ "$badge" != "$newest" ] && [ "$older" = "$badge" ]; then
            echo "::error::the README badge says $badge but the newest release is $newest."
            echo "::error::Edit the version badge in README.md and set it to $newest."
            exit 1
          fi
          if [ "$badge" != "$newest" ]; then
            echo "the badge says $badge and the newest release is $newest; a release looks to be in flight"
            exit 0
          fi
          echo "the badge says $badge, which is the newest release"
